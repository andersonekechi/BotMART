# ─────────────────────────────────────────────────────────
# BotMART — Nginx config (isolated, does NOT touch other sites)
#
# INSTALL:
#   sudo cp /var/www/botmart/nginx.conf /etc/nginx/sites-available/botmart
#   sudo ln -s /etc/nginx/sites-available/botmart /etc/nginx/sites-enabled/botmart
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN below with your actual domain/subdomain
# e.g. shop.eliteflipblankreact.xyz  or  botmart.yourdomain.com
# ─────────────────────────────────────────────────────────

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Redirect HTTP to HTTPS (remove this block if not using SSL yet)
    return 301 https://$server_name$request_uri;
}

server {
    # If you don't have SSL yet, change this to:  listen 80;
    # and remove the ssl_* lines below
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # SSL certificates — run certbot AFTER setting up the domain:
    #   sudo certbot --nginx -d YOUR_DOMAIN
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # ── Dashboard (static React build) ──────────────────
    location / {
        root /var/www/botmart/server/public;
        try_files $uri $uri/ /index.html;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # ── API + Bot webhook (proxy to Node on port 4100) ──
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # ── Health check ────────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Uploaded product images ─────────────────────────
    location /uploads/ {
        alias /var/www/botmart/server/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }
}
